services:
  runner:
    build: ./runner
    init: true
    ports:
      - "8080:8080"
      - "6080-6089:6080-6089"
    volumes:
      - ./tests:/tests
    environment:
      - TESTS_DIR=/tests
      - USE_NOVNC=true
      # 既定の listen は 127.0.0.1(ローカル限定)だが、compose ではコンテナ外
      # (ホスト→コンテナ、portal/ブラウザ)から到達する必要があるため、ここで
      # 明示的に全インターフェースに広げて従来の到達性を維持する。
      - PORT=0.0.0.0:8080
      - VNC_INTERFACE=0.0.0.0

  portal:
    build:
      context: ./portal
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
        NEXT_PUBLIC_NOVNC_HOST: http://localhost
    ports:
      - "3000:3000"

