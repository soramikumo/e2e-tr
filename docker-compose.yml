services:
  runner:
    build: ./runner
    ports:
      - "8080:8080"
    volumes:
      - ./tests:/tests
    environment:
      - TESTS_DIR=/tests

  portal:
    build:
      context: ./portal
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - runner
