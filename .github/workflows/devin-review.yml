name: Devin Review

on:
  pull_request:
    types: [review_requested]

permissions:
  pull-requests: write

jobs:
  trigger:
    name: Trigger Devin Review
    runs-on: ubuntu-latest
    # Devin がレビュワーにリクエストされたときだけ実行
    if: github.event.requested_reviewer.login == 'devin-ai-integration[bot]'
    steps:
      - name: Post Devin review request
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: '@devin-ai-integration please review this PR'
            })
